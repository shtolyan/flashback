services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: flashback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flashback_local}
      POSTGRES_DB: flashback
    ports:
      - "127.0.0.1:${DB_PORT:-5437}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashback -d flashback"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  app:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgres://flashback:${POSTGRES_PASSWORD:-flashback_local}@db:5432/flashback
      HOST: 0.0.0.0
      PORT: 4310
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      INSTANCE_NAME: ${INSTANCE_NAME:-Flashback}
      REPOSITORY_URL: ${REPOSITORY_URL:-}
    ports:
      - "${PORT:-4310}:4310"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
